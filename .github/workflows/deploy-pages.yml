name: Build and Deploy Web Game

on:
  workflow_run:
    workflows: ["Validate Game and Assets"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Browser Artifact
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      POV_BLASTER_API_URL: ${{ vars.POV_BLASTER_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build web target
        run: python build.py --web
      - name: Verify browser artifact
        shell: bash
        run: test -s build/web/index.html && test -s build/web/browserfs.min.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Notify Successful Pages Deployment
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send completion email
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "POV-Blaster: GitHub Pages deploy completed"
          to: "richardharris84@gmail.com"
          from: "richardharris84@gmail.com"
          body: |
            Gold code finalize. All builds completed successfully. Project publish to GitHub Pages.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            GitHub Pages URL: ${{ needs.deploy.outputs.page_url }}
