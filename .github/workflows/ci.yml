name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate theme assets
        shell: pwsh
        run: ./tools/generate_themes.ps1 -ValidateOnly
      - name: Audit theme image assets
        run: python tools/audit_themes.py --check

  notify:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send CI success email
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "POV-Blaster: CI build passed"
          to: "richardharris84@gmail.com"
          from: "richardharris84@gmail.com"
          body: |
            POV-Blaster CI passed on main.

            The GitHub Pages deployment workflow is publishing the corresponding web build.
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
