services:
  - type: web
    name: pov-blaster-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pov-blaster-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://richardharris84.github.io

databases:
  - name: pov-blaster-db
    plan: basic-256mb
